<!doctype html>
<html lang="en" data-theme="clay" data-mode="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF7F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1E1C" />
    <meta
      name="description"
      content="How much can I spend today, and until payday? An offline budget planner."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Steady" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Steady Payday Planner</title>
    <script>
      // Runs before first paint (the module bundle is deferred), so a forced dark mode or
      // a non-default theme never flashes the default palette. Same key as src/app/theme.ts.
      try {
        var a = JSON.parse(localStorage.getItem('steady:appearance') || 'null')
        if (a) {
          var r = document.documentElement
          r.dataset.theme = a.theme
          r.dataset.mode = a.mode
          r.dataset.motion = a.reducedMotion
          r.style.setProperty('--text-scale', a.largeText + '%')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
